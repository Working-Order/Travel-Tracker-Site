name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Write Firebase config
        shell: bash
        run: |
          cat > firebase-config.default.json <<'JSON'
          {
            "apiKey": "AIzaSyB02U1MIit3giFVWUQkE7K2Pi2Mq1Jn8HI",
            "authDomain": "trip-tracker-73508.firebaseapp.com",
            "projectId": "trip-tracker-73508",
            "storageBucket": "trip-tracker-73508.firebasestorage.app",
            "messagingSenderId": "793672084504",
            "appId": "1:793672084504:web:e93ae53ad62b8a3e6de76d",
            "workspaceId": "shared"
          }
          JSON

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
