<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Travel" />
    <title>Travel Tracker</title>
    <base href="/Travel-Tracker-Site/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="boot">
            <svg class="boot-icon" viewBox="0 0 100 100" aria-hidden="true">
                <path d="M86 17 L13 49 L47 57 Z" fill="currentColor" />
                <path d="M86 17 L47 57 L55 87 Z" fill="currentColor" opacity="0.75" />
            </svg>
            <p>Loading Travel Tracker...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Close</a>
    </div>
    <div id="update-banner" hidden>
        <span>A new version is ready.</span>
        <button type="button" id="update-reload">Reload</button>
        <button type="button" id="update-dismiss" aria-label="Dismiss">&times;</button>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Keeps an installed PWA current.
        //
        // The service worker already calls skipWaiting and clients.claim, so a
        // new build takes over the moment it installs. That alone is not enough:
        // the page you are looking at has already loaded the old WebAssembly, so
        // without a reload you keep seeing the previous version until you delete
        // and reinstall the app. This closes that gap.
        (function () {
            if (!('serviceWorker' in navigator) || location.protocol !== 'https:') {
                return;
            }

            // An update that lands this soon after load is treated as part of
            // starting the app, so it reloads silently. Later than this and the
            // user is mid-task, where yanking the page away could lose whatever
            // they were typing -- so they get asked instead.
            const SILENT_RELOAD_WINDOW_MS = 12000;
            const loadedAt = Date.now();

            // Whether a worker was already in charge when this page loaded. On a
            // first-ever install there is none, and the page is already running
            // the assets that worker just cached, so there is nothing to reload.
            const hadController = !!navigator.serviceWorker.controller;

            let handled = false;

            function reloadOnce() {
                if (handled) {
                    return;
                }

                handled = true;
                window.location.reload();
            }

            function offerReload() {
                if (handled) {
                    return;
                }

                handled = true;

                const banner = document.getElementById('update-banner');
                if (!banner) {
                    return;
                }

                banner.hidden = false;
                document.getElementById('update-reload')
                    .addEventListener('click', () => window.location.reload());
                document.getElementById('update-dismiss')
                    .addEventListener('click', () => { banner.hidden = true; });
            }

            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!hadController) {
                    return;
                }

                if (Date.now() - loadedAt < SILENT_RELOAD_WINDOW_MS) {
                    reloadOnce();
                } else {
                    offerReload();
                }
            });

            navigator.serviceWorker.register('service-worker.js').then(function (registration) {
                // Ask immediately rather than waiting for the browser's own
                // once-a-day-ish check.
                registration.update().catch(function () { });

                // The important one for a home-screen app. iOS usually resumes
                // an installed PWA rather than starting it cold, so a plain
                // load handler can go days without firing. Checking whenever the
                // app comes back to the foreground is what makes "next launch"
                // actually mean the next launch.
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') {
                        registration.update().catch(function () { });
                    }
                });

                // A worker that installed but did not take over -- shouldn't
                // happen given skipWaiting, but if it ever does the app would
                // sit on a stale build forever, so nudge it through.
                if (registration.waiting && navigator.serviceWorker.controller) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
            }).catch(function () {
                // No offline support this session. The app still works online.
            });
        })();
    </script>
</body>

</html>
